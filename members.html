<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Realms SMP - Members List</title>
        <style>
        body { background-color: white; font-family: sans-serif; margin: 40px; text-align: center; }
        h1 { color: black; font-size: 43px; margin-bottom: 30px; }
        .button-link { display: inline-block; padding: 10px 20px; background-color: #007BFF; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; margin-bottom: 20px; }
        .button-link:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-save { background-color: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        table { width: 100%; max-width: 950px; margin: 0 auto; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .bar-container { background-color: #e0e0e0; border-radius: 4px; width: 100%; height: 20px; overflow: hidden; position: relative; }
        .bar-fill { background-color: #4CAF50; height: 100%; transition: width 0.3s ease; }
        .bar-text { position: absolute; left: 8px; top: 0; font-size: 12px; font-weight: bold; color: black; line-height: 20px; }
        .point-input { width: 55px; padding: 4px; font-size: 13px; }
        .group-input { width: 150px; padding: 4px; font-size: 13px; margin-top: 3px; display: block; }
        </style>
    </head>
    <body>
        
        <a href="index.html" class="button-link" style="float: left;">Back</a>
        <br style="clear:both;">

        <h1>SMP Members List</h1>

        <table>
            <thead>
                <tr>
                    <th>Minecraft Name</th>
                    <th>Real Name</th>
                    <th>Groups Joined (Max 2)</th>
                    <th>Event Points Graph</th>
                    <th class="admin-col" style="display: none;">Admin Actions</th>
                </tr>
            </thead>
            <tbody id="members-table-body"></tbody>
        </table>

        <script>
        const getPlayersDB = () => JSON.parse(localStorage.getItem('smp_players')) || {};
        const savePlayersDB = (db) => localStorage.setItem('smp_players', JSON.stringify(db));

        function checkAdminStatus() {
            const mc = localStorage.getItem('smp_active_session');
            const real = localStorage.getItem('smp_active_real_name');
            return (mc === "WizardofWaterloo" && real === "Kyrillos");
        }

        window.onload = function() {
            renderTable();
        };

        function renderTable() {
            const db = getPlayersDB();
            const tableBody = document.getElementById('members-table-body');
            const isAdmin = checkAdminStatus();
            
            tableBody.innerHTML = '';
            document.querySelectorAll('.admin-col').forEach(col => {
                col.style.display = isAdmin ? "table-cell" : "none";
            });

            const players = Object.keys(db);
            if (players.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${isAdmin ? 5 : 4}" style="text-align: center; color: #777;">No registered members.</td></tr>`;
                return;
            }

            let maxPoints = 0;
            players.forEach(mcName => {
                const pts = db[mcName].eventPoints || 0;
                if (pts > maxPoints) maxPoints = pts;
            });
            if (maxPoints === 0) maxPoints = 10;

            players.forEach(mcName => {
                const playerData = db[mcName];
                const realName = playerData.realName || "N/A";
                const points = playerData.eventPoints || 0;
                
                // Read from array, or safely fall back to the old single string item format
                let groupList = [];
                if (playerData.groups && Array.isArray(playerData.groups)) {
                    groupList = playerData.groups;
                } else if (playerData.group && playerData.group !== "None") {
                    groupList = [playerData.group];
                }
                
                const groupDisplay = groupList.length > 0 ? groupList.join(', ') : "None";
                const barPercentage = Math.min((points / maxPoints) * 100, 100);
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${mcName}</td>
                    <td>${realName}</td>
                    <td style="font-weight: bold; color: ${groupDisplay === 'None' ? '#777' : '#007BFF'}">${groupDisplay}</td>
                    <td>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${barPercentage}%;"></div>
                            <span class="bar-text">${points} pts</span>
                        </div>
                    </td>
                `;

                if (isAdmin) {
                    row.innerHTML += `
                        <td class="admin-col">
                            <div style="margin-bottom: 5px;">
                                <span style="font-size:11px;color:#555;">Points:</span>
                                <input type="number" class="point-input" id="input-pts-${mcName}" value="${points}" min="0">
                            </div>
                            <div>
                                <span style="font-size:11px;color:#555;">Groups (split with comma):</span>
                                <input type="text" class="group-input" id="input-group-${mcName}" value="${groupDisplay}">
                            </div>
                            <button class="btn-save" style="margin-top: 6px; width: 100%; box-sizing:border-box; margin-left:0;" onclick="updatePlayer('${mcName}')">Save Changes</button>
                            <button class="btn-danger" style="margin-top: 4px; width: 100%;" onclick="deleteMember('${mcName}')">Delete</button>
                        </td>
                    `;
                }
                
                tableBody.appendChild(row);
            });
        }

        function updatePlayer(mcName) {
            const ptsInput = document.getElementById(`input-pts-${mcName}`);
            const groupInput = document.getElementById(`input-group-${mcName}`);
            
            const newPoints = parseInt(ptsInput.value, 10) || 0;
            const groupRawText = groupInput.value.trim();
            
            let newGroupsArray = [];
            if (groupRawText !== "" && groupRawText.toLowerCase() !== "none") {
                newGroupsArray = groupRawText.split(',').map(g => g.trim()).filter(g => g !== "");
            }
            
            let db = getPlayersDB();
            if (db[mcName]) {
                db[mcName].eventPoints = newPoints;
                db[mcName].groups = newGroupsArray;
                if (db[mcName].group) delete db[mcName].group; // Clear old legacy property if it exists
                savePlayersDB(db);
                renderTable();
            }
        }

        function deleteMember(mcName) {
            if (confirm(`Remove ${mcName}?`)) {
                let db = getPlayersDB();
                delete db[mcName];
                savePlayersDB(db);
                renderTable();
            }
        }
        </script>
    </body>
</html>
